name: Turso catalogue POC (isolated)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify, bounded sample, or approved 80%-guarded growth toward 500K
        type: choice
        options: [verify, sample, grow]
        default: verify
        required: true
      run_id:
        description: Saved Turso-only run ID (sample only; reuse to resume)
        type: string
        default: turso-poc-sample-001
      snapshot:
        description: Pinned date or auto at first start only (sample only)
        type: string
        default: auto

permissions:
  contents: read

concurrency:
  group: turso-catalogue-poc
  cancel-in-progress: false

jobs:
  catalogue-poc:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.operation == 'grow' && 330 || 30 }}
    defaults:
      run:
        working-directory: book-app
    env:
      SOURCE_SHA: 2526cea33bde5c9ec4e2cad034a1c4eb00c3b492
      INPUT_OPERATION: ${{ inputs.operation }}
      INPUT_RUN_ID: ${{ inputs.run_id }}
      INPUT_SNAPSHOT: ${{ inputs.snapshot }}
      SAMPLE_APPROVED_SHA: ${{ vars.TURSO_POC_SAMPLE_APPROVED_SHA }}
      GROW_APPROVED_SHA: ${{ vars.TURSO_POC_GROW_APPROVED_SHA }}
    steps:
      - name: Validate bounded operation and sample gate
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INPUT_OPERATION" == verify || "$INPUT_OPERATION" == sample || "$INPUT_OPERATION" == grow ]]
          if [[ "$INPUT_OPERATION" == sample ]]; then
            [[ "$INPUT_RUN_ID" =~ ^[A-Za-z0-9_-]{1,80}$ ]]
            [[ "$INPUT_SNAPSHOT" == auto || "$INPUT_SNAPSHOT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
            if [[ "$SAMPLE_APPROVED_SHA" != "$SOURCE_SHA" ]]; then
              echo 'Sample is locked: independent ingestion checks and account overages/quota proof must pass first.'
              exit 1
            fi
          fi
          if [[ "$INPUT_OPERATION" == grow && "$GROW_APPROVED_SHA" != "$SOURCE_SHA" ]]; then
            echo 'Growth is locked until independent quota/resume checks and account verification pass.'
            exit 1
          fi
          echo "Immutable Turso POC source: $SOURCE_SHA"
          echo 'No Neon credentials, application deployment, database replica, or dump artifacts are used.'
      - name: Check out immutable POC source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: StMichael9/Book-app
          ref: 2526cea33bde5c9ec4e2cad034a1c4eb00c3b492
          path: book-app
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned pure HTTP dependencies only
        run: python -m pip install --disable-pip-version-check -r tools/catalogue_poc/requirements.txt
      - name: Run in-memory tests without credentials
        run: python -m unittest discover -s tools/catalogue_poc/tests -v
      - name: Verify isolated Turso capabilities
        if: inputs.operation == 'verify'
        env:
          CATALOGUE_TURSO_URL: libsql://bookvane-catalogue-poc-stmichael9.aws-us-west-2.turso.io
          CATALOGUE_TURSO_TOKEN: ${{ secrets.TURSO_CATALOGUE_POC_TOKEN }}
          CATALOGUE_ACCOUNT_GUARD: required
          TURSO_CATALOGUE_USAGE_TOKEN: ${{ secrets.TURSO_CATALOGUE_USAGE_TOKEN }}
        run: |
          python -m tools.catalogue_poc.cli init
          python -m tools.catalogue_poc.cli status
          echo '### Turso quota/connection verification passed (no new books imported)' >> "$GITHUB_STEP_SUMMARY"
      - name: Run one bounded sample session (no automatic continuation)
        if: inputs.operation == 'sample'
        env:
          CATALOGUE_TURSO_URL: libsql://bookvane-catalogue-poc-stmichael9.aws-us-west-2.turso.io
          CATALOGUE_TURSO_TOKEN: ${{ secrets.TURSO_CATALOGUE_POC_TOKEN }}
          CATALOGUE_POC_REMOTE_JOB_APPROVED: 'yes'
          CATALOGUE_ACCOUNT_GUARD: required
          TURSO_CATALOGUE_USAGE_TOKEN: ${{ secrets.TURSO_CATALOGUE_USAGE_TOKEN }}
          OPEN_LIBRARY_USER_AGENT: ${{ vars.CATALOGUE_USER_AGENT }}
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.catalogue_poc.cli init
          set +e
          python -m tools.catalogue_poc.cli ingest \
            --run-id "$INPUT_RUN_ID" --snapshot "$INPUT_SNAPSHOT" \
            --target-works 1000 --batch-size 50 --time-budget-seconds 1200 \
            --max-storage-bytes 250000000 --max-session-rows-written 100000
          result=$?
          set -e
          python -m tools.catalogue_poc.cli status
          if [[ "$result" == 75 ]]; then
            echo '### Sample paused safely; checkpoint retained, not a completed catalogue' >> "$GITHUB_STEP_SUMMARY"
            echo 'Review throughput, source integrity and account usage before continuation.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$result" != 0 ]]; then
            echo '### Sample failed; do not retry or increase limits without reviewing the error' >> "$GITHUB_STEP_SUMMARY"
            exit "$result"
          else
            echo '### Sample finished; larger stages still require measured capacity review' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Continue pinned catalogue toward 500K under the 80 percent ceiling
        if: inputs.operation == 'grow'
        env:
          CATALOGUE_TURSO_URL: libsql://bookvane-catalogue-poc-stmichael9.aws-us-west-2.turso.io
          CATALOGUE_TURSO_TOKEN: ${{ secrets.TURSO_CATALOGUE_POC_TOKEN }}
          CATALOGUE_ACCOUNT_GUARD: required
          TURSO_CATALOGUE_USAGE_TOKEN: ${{ secrets.TURSO_CATALOGUE_USAGE_TOKEN }}
          CATALOGUE_POC_REMOTE_JOB_APPROVED: 'yes'
          OPEN_LIBRARY_USER_AGENT: ${{ vars.CATALOGUE_USER_AGENT }}
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.catalogue_poc.cli init
          set +e
          python -m tools.catalogue_poc.grow | tee "$RUNNER_TEMP/turso-session.log"
          result=${PIPESTATUS[0]}
          set -e
          echo '### Turso-only guarded session result' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'source_retry|source_failure|quota_threshold|quota_stop|"status": "complete"|"status": "stopped"' "$RUNNER_TEMP/turso-session.log" | tail -n 80 >> "$GITHUB_STEP_SUMMARY" || true
          if [[ "$result" == 75 ]]; then
            if grep -q '"quota_stop": true' "$RUNNER_TEMP/turso-session.log"; then
              echo 'STOP: quota/account guard paused the import. Do not resume without review/user direction.' >> "$GITHUB_STEP_SUMMARY"
            elif grep -q '"pause_kind": "time"' "$RUNNER_TEMP/turso-session.log" && grep -q '"resume_allowed": true' "$RUNNER_TEMP/turso-session.log"; then
              echo 'PAUSED: time-only checkpoint retained. Check progress before a same-guard continuation.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'STOP: capacity/unknown safety pause. No automatic continuation; review required.' >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [[ "$result" != 0 ]]; then
            echo 'FAILED: inspect the relevant error. No automatic retry or target/limit change.' >> "$GITHUB_STEP_SUMMARY"
            exit "$result"
          else
            echo 'Finished the approved stages; verify counts/integrity before claiming completion.' >> "$GITHUB_STEP_SUMMARY"
          fi

